services:
  portfolio:
    build: .
    container_name: alexportfolio
    restart: unless-stopped
    # run as the host user so files the dashboard writes into the site folder aren't root-owned
    user: "1000:1000"
    env_file: .env
    environment:
      # overrides the .env value — /site is where the site folder is mounted
      # *inside* the container, regardless of its real path on the host
      SITE_REPO_PATH: /site
      HOME: /tmp
    volumes:
      - ${SITE_REPO_HOST_PATH}:/site
    networks: [nginx_pm_default]

# reached by Nginx Proxy Manager by container name, like the other services here
networks:
  nginx_pm_default:
    external: true
